<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GABRIEL</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  @page{size:1200px 805px;margin:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:805px;overflow:hidden;background:#0b4f8a}
  a.card{position:relative;display:block;width:1200px;height:805px;text-decoration:none;
    background:url(img/portada.jpg) center/cover no-repeat}
  .shade{position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(180deg,transparent,rgba(5,30,70,.55))}
  .date{position:absolute;left:0;right:0;bottom:118px;text-align:center;font-family:"Fredoka";font-weight:600;font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .cta{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-family:"Baloo 2";font-weight:800;font-size:40px;color:#fff;white-space:nowrap;
    background:linear-gradient(180deg,#ffb04a 0%,#ff7a12 55%,#f05a00 100%);border:4px solid #fff;border-radius:999px;padding:4px 48px;
    box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 3px rgba(120,40,0,.5)}
</style>
</head>
<body>
<a class="card" href="https://ml2khhw.github.io/cumple-gabriel/">
  <div class="shade"></div>
  <div class="cta">👉 Toca aquí 🫧</div>
</a>
</body>
</html>
